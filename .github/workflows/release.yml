name: Release on Main Push

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read VERSION file
        id: version
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          if [[ ! "$VERSION" =~ ^V[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match Vx.x.x format"
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Ensure tag exists on current commit
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            TAG_COMMIT=$(git rev-list -n 1 "$VERSION")
            if [[ "$TAG_COMMIT" != "$GITHUB_SHA" ]]; then
              echo "Tag $VERSION exists on a different commit."
              exit 1
            fi
          else
            git tag "$VERSION" "$GITHUB_SHA"
            git push origin "$VERSION"
          fi

      - name: Generate release notes
        id: notes
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          {
            echo "value<<EOF"
            echo "## $VERSION"
            echo
            echo "Release generated automatically from push to main."
            echo
            echo "- Source commit: $GITHUB_SHA"
            echo "- App version: $VERSION"
            echo "- Version policy: SemVer Vx.x.x"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.value }}
          name: AlbertTranslator ${{ steps.version.outputs.value }}
          body: ${{ steps.notes.outputs.value }}
          generate_release_notes: true
